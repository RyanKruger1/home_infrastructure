apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-health-test"
  annotations:
    "helm.sh/hook": test
spec:
  template:
    spec:
      containers:
        - name: health-test
          image: curlimages/curl:8.7.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Checking app health..."
              curl -f http://{{ include "mychart.fullname" . }}:8080/health
      restartPolicy: Never
